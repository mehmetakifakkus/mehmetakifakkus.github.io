<li class="post-item">
  <a href="{{ include.post.url | relative_url }}">
    <span class="post-item-title">{{ include.post.title }}</span>
    <span class="post-item-meta">{% include date_tr.html date=include.post.date %}{% if include.post.tags.size > 0 %} · {{ include.post.tags | first }}{% endif %} · {% include reading_time.html content=include.post.content %} dk</span>
  </a>
</li>
