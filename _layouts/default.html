<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<script>
			// Apply saved/system theme before first paint to avoid a flash
			(function () {
				var t = localStorage.getItem('theme');
				if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.setAttribute('data-theme', t);
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="author" content="Mehmet Akif AKKUŞ">
		{% seo %}
		{% feed_meta %}
		<link rel='shortcut icon' href='/img/favicon2.ico'/>
		<link rel="stylesheet" type="text/css" href="/css/bootstrap.min.css">
		<link rel="stylesheet" type="text/css" href="/css/jumbotron-narrow.css">
		<link rel="stylesheet" type="text/css" href="/css/style.css">
		<link rel="stylesheet" type="text/css" href="/css/syntax.css">
		{% include analytics.html %}
	</head>
	<body>

<div class="container">
			
	<div class="header">
		<ul class="nav nav-pills pull-right">
			<li id="projects_page" class="passive"><a href="/projects" title="Projects">Projects</a></li>
			<li id="blog_page" class="passive"><a href="/blog" title="Notes">Blog</a></li>
			<li id="contact_page" class="passive"><a href="/contact" title="Contact">Contact</a></li>
			<li><button type="button" id="theme-toggle" class="theme-toggle" aria-label="Karanlık/aydınlık mod" title="Karanlık/aydınlık mod">&#9790;</button></li>
		</ul>
		<h3 class="text-muted"><a href="/">Mehmet Akif AKKUS</a></h3>
	</div> <!-- /header -->	
    
	{{ content }}

	<div class="footer">
		<div class="col-sm-10">	
			<p><small>&copy; mehmetakifakkus 2016&ndash;{{ site.time | date: "%Y" }} · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></small></p>
		</div>

		<div class="col-sm-2">			
			<a href="/about">About</a>
		</div>
	</div>	
	
		
</div><!-- /.container -->

<!-- javascript at the end of the doc so page loads faster -->
<script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
<script src="/js/bootstrap.min.js"></script>
<script src="/js/library.js"></script>
<script src="/js/theme.js"></script>
			
		
<script>
var activeNav = document.getElementById("{{page.link}}_page");
if (activeNav) activeNav.className = "active";	
</script>
		
<script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      tex2jax: {
        skipTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
        inlineMath: [['$','$']]
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@2.7.9/MathJax.js?config=TeX-AMS-MML_HTMLorMML" type="text/javascript"></script>
	
		
</body>
</html>
