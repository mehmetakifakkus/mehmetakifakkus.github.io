<!DOCTYPE html>
<html lang="tr">
	<head>
		<meta charset="utf-8">
		<script>
			// Apply saved/system theme before first paint to avoid a flash
			(function () {
				var t;
				try { t = localStorage.getItem('theme'); } catch (e) {}
				if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				document.documentElement.setAttribute('data-theme', t);
			})();
		</script>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		{% seo %}
		{% feed_meta %}
		<link rel="shortcut icon" href="/img/favicon2.ico">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
		<link rel="stylesheet" href="/css/site.css">
		<link rel="stylesheet" href="/css/syntax.css">
		{% include analytics.html %}
	</head>
	<body>
		<header class="site-header">
			<div class="wrap">
				<a class="logo" href="/"><span class="logo-mark">MA</span><span class="logo-name">Mehmet Akif Akkuş</span></a>
				<nav class="site-nav" aria-label="Ana menü">
					<a href="/projects/"{% if page.link == "projects" %} class="active" aria-current="page"{% endif %}>Projeler</a>
					<a href="/blog/"{% if page.link == "blog" %} class="active" aria-current="page"{% endif %}>Yazılar</a>
					<a href="/about/" class="{% if page.link == "about" %}active {% endif %}hide-sm"{% if page.link == "about" %} aria-current="page"{% endif %}>Hakkında</a>
					<a href="/contact/"{% if page.link == "contact" %} class="active" aria-current="page"{% endif %}>İletişim</a>
					<button type="button" id="theme-toggle" class="theme-toggle" aria-label="Karanlık/aydınlık mod" title="Karanlık/aydınlık mod">&#9790;</button>
				</nav>
			</div>
		</header>

		<main>
			{{ content }}
		</main>

		<footer class="site-footer">
			<div class="wrap">
				<span>&copy; 2009&ndash;{{ site.time | date: "%Y" }} Mehmet Akif Akkuş</span>
				<span class="footer-links">
					<a href="https://github.com/mehmetakifakkus">GitHub</a> ·
					<a href="{{ '/feed.xml' | relative_url }}">RSS</a> ·
					<a href="/about/">Hakkında</a> ·
					<a href="mailto:mehmetakifakkus@gmail.com">E-posta</a>
				</span>
			</div>
		</footer>

		<script src="/js/theme.js"></script>
	</body>
</html>
