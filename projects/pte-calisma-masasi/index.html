<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PTE Çalışma Masası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Düzen: masaüstünde solda sabit gezinme şeridi, telefonda altta sekme çubuğu; tek çalışma sütunu (en çok 860px).
     Fikir: lacivert mürekkep + fosforlu kalem sarısı; dört beceri dört ayrı renkle kodlanır. */
  --bg:#eef1f5; --surface:#ffffff; --sunk:#e3e8ee; --ink:#15202b; --muted:#566573; --line:#d2d9e1;
  --primary:#1c2a56; --on-primary:#ffffff; --mark:#ffd84d; --on-mark:#1b1a08;
  --sp:#b4491b; --wr:#6a45b0; --rd:#1766ad; --ls:#0c775c;
  --good:#17794a; --warn:#9a6200; --bad:#bf3030;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f141b; --surface:#18202b; --sunk:#111821; --ink:#e7ecf2; --muted:#9aa8b6; --line:#2c3846;
    --primary:#ffd84d; --on-primary:#1b1a08; --mark:#ffd84d; --on-mark:#1b1a08;
    --sp:#f0895c; --wr:#b89cf2; --rd:#72b6f2; --ls:#4fd0a7;
    --good:#4ccf8d; --warn:#e8b04a; --bad:#f28080;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f141b; --surface:#18202b; --sunk:#111821; --ink:#e7ecf2; --muted:#9aa8b6; --line:#2c3846;
  --primary:#ffd84d; --on-primary:#1b1a08; --mark:#ffd84d; --on-mark:#1b1a08;
  --sp:#f0895c; --wr:#b89cf2; --rd:#72b6f2; --ls:#4fd0a7;
  --good:#4ccf8d; --warn:#e8b04a; --bad:#f28080;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--font-body)}
h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-0.01em}
h1{font-size:1.9rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}
[hidden]{display:none!important}

/* ---------- iskelet ---------- */
.app{display:grid;grid-template-columns:212px minmax(0,1fr)}
html,body{min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line)}
.rail-in{padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.15rem;line-height:1.1;padding:0 8px}
.brand span{background:linear-gradient(transparent 55%,var(--mark) 55%);color:var(--ink);padding:0 2px}
:root[data-theme="dark"] .brand span{background:none;color:var(--mark)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand span{background:none;color:var(--mark)}}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a:hover{background:var(--sunk);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--sunk);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--mark)}
.rail-foot{padding:0 8px;font-size:.8rem;color:var(--muted)}
main{padding:30px clamp(16px,4vw,44px) 70px;max-width:940px;width:100%}
.view{display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.head .sub{color:var(--muted);margin-top:4px}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;bottom:0;left:0;right:0;z-index:20;border-right:0;border-top:1px solid var(--line)}
  .rail-in{position:static;flex-direction:row;padding:4px 6px}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-between;gap:0}
  .nav a{flex:1;justify-content:center;padding:10px 2px;font-size:.74rem;text-align:center}
  .nav a[aria-current="page"]{box-shadow:inset 0 -3px 0 var(--mark)}
  main{padding:20px 16px 96px}
  h1{font-size:1.55rem}
}

/* ---------- ortak parçalar ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tile .big{font-family:var(--font-display);font-size:2rem;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.tile .lab{color:var(--muted);font-size:.85rem;margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 15px;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.sm{padding:6px 11px;font-size:.875rem}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--mark) 55%,transparent)}}
@media (prefers-reduced-motion:reduce){.btn.pulse{animation:none;box-shadow:0 0 0 4px var(--mark)}}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;background:var(--sunk);color:var(--ink);white-space:nowrap}
.chip.mark{background:var(--mark);color:var(--on-mark)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.spread{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.bar{height:8px;background:var(--sunk);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--primary));border-radius:999px}
.note{border-left:4px solid var(--mark);background:var(--surface);border-radius:0 var(--r) var(--r) 0;padding:12px 16px}
.pct.good{color:var(--good)} .pct.warn{color:var(--warn)} .pct.bad{color:var(--bad)}

/* ---------- bugün ---------- */
.streak{display:grid;grid-template-columns:auto 1fr;gap:8px 26px;align-items:center}
.streak .n{font-family:var(--font-display);font-weight:700;font-size:3.4rem;line-height:.95;font-variant-numeric:tabular-nums}
.streak .n small{font-size:1rem;font-weight:500;color:var(--muted);margin-left:6px;font-family:var(--font-body)}
.week{display:flex;gap:8px;flex-wrap:wrap}
.week div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72rem;color:var(--muted)}
.week i{width:26px;height:26px;border-radius:7px;background:var(--sunk);border:1px solid var(--line);display:block}
.week .on i{background:var(--mark);border-color:var(--mark)}
.week .today i{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:520px){.streak{grid-template-columns:1fr}}
.block{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;border-left:5px solid var(--c,var(--line))}
.block.done{opacity:.72}
.block .t{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.block .est{color:var(--muted);font-size:.85rem}
.block .act{display:flex;align-items:center;gap:10px}
.tick{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:600;font-size:.9rem}
@media (max-width:520px){.block{grid-template-columns:1fr}}

/* ---------- plan ---------- */
.phasebar{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.phasebar div{display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:600;min-width:0;border-right:1px solid var(--surface);background:var(--sunk);color:var(--muted)}
.phasebar div.cur{background:var(--mark);color:var(--on-mark)}
.phasebar div.past{background:color-mix(in srgb,var(--primary) 22%,var(--sunk))}
.weeks{display:flex;flex-direction:column;gap:10px}
.wk{display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 16px}
.wk.cur{border-color:var(--ink);box-shadow:inset 4px 0 0 var(--mark)}
.wk .no{font-family:var(--font-display);font-weight:700}
.wk ul{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:.92rem}
@media (max-width:520px){.wk{grid-template-columns:1fr}}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- pratik ---------- */
.skillhead{display:flex;align-items:center;gap:10px;margin-top:6px}
.skillhead i{width:12px;height:12px;border-radius:3px;background:var(--c)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.type{border-top:4px solid var(--c);display:flex;flex-direction:column;gap:8px}
.type .meta{font-size:.85rem;color:var(--muted)}
.type details{font-size:.9rem}
.type summary{cursor:pointer;font-weight:600;color:var(--muted)}
.type details ul{margin:6px 0 0;padding-left:18px}
.type .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:6px}

/* ---------- oturum ---------- */
.sess-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.instr{color:var(--muted)}
.stage{display:flex;flex-direction:column;gap:16px}
.passage{font-size:1.05rem;line-height:1.75;max-width:68ch}
.passage.big{font-size:1.2rem}
.audio{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--sunk);border-radius:var(--r);padding:12px 14px}
.audio.on .eq{display:inline-flex}
.eq{display:none;gap:3px;align-items:flex-end;height:18px}
.eq i{width:4px;background:var(--ls);border-radius:2px;animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(1){height:8px}.eq i:nth-child(2){height:16px;animation-delay:.2s}.eq i:nth-child(3){height:11px;animation-delay:.4s}
@keyframes eq{50%{transform:scaleY(.4)}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none}}
.flash{flex-basis:100%;font-size:1.1rem;font-weight:500}
.speakbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.clock{font-family:var(--font-mono);font-size:1.7rem;font-variant-numeric:tabular-nums;min-width:4.2ch}
.clock.low{color:var(--bad)}
.phase{font-weight:600;flex:1;min-width:140px}
.live{border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--muted);min-height:3em}
textarea,input[type=text],input[type=number],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:170px;resize:vertical;line-height:1.6}
.inline-in{width:9.5em;display:inline-block;padding:3px 8px;margin:0 2px}
select.inline-in{width:auto;min-width:8em}
.inline-in.ok{border-color:var(--good);color:var(--good);font-weight:600}
.inline-in.no{border-color:var(--bad);color:var(--bad)}
.fix{color:var(--good);font-weight:600;font-size:.9em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:11px 13px;cursor:pointer;width:100%}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);font-weight:500}
.opt .k{font-family:var(--font-mono);color:var(--muted)}
.opt.right{border-color:var(--good);box-shadow:inset 4px 0 0 var(--good)}
.opt.wrong{border-color:var(--bad);box-shadow:inset 4px 0 0 var(--bad)}
.opt:disabled{cursor:default;opacity:1}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:12px;background:var(--sunk);border-radius:var(--r)}
.word{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 11px;cursor:pointer;font-weight:500}
.word:hover{border-color:var(--ink)}
.slot{display:inline-block;min-width:6.5em;border:1px dashed var(--muted);border-radius:6px;padding:1px 8px;margin:0 2px;background:var(--surface);cursor:pointer;text-align:center;line-height:1.5}
.slot.filled{border-style:solid;font-weight:600}
.slot.ok{border-color:var(--good);color:var(--good)} .slot.no{border-color:var(--bad);color:var(--bad)}
.order{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.order li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.order .mv{display:flex;flex-direction:column;gap:4px}
.order .mv button{width:34px;height:28px;padding:0}
.order li.ok{box-shadow:inset 4px 0 0 var(--good)} .order li.no{box-shadow:inset 4px 0 0 var(--bad)}
.hiw span{cursor:pointer;border-radius:4px;padding:1px 2px}
.hiw span:hover{background:var(--sunk)}
.hiw span.sel{background:var(--mark);color:var(--on-mark)}
.hiw.done span{cursor:default}
.hiw span.hit{background:color-mix(in srgb,var(--good) 28%,transparent);color:var(--ink);font-weight:600}
.hiw span.miss{outline:2px solid var(--good)}
.hiw span.false{background:color-mix(in srgb,var(--bad) 28%,transparent);color:var(--ink)}
.counter{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between}
.review{border:1px solid var(--line);border-top:5px solid var(--mark);border-radius:var(--r);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:14px}
.review h4{margin:0 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.review ul{margin:0;padding-left:20px}
.review li.hit{color:var(--good)} .review li.gap{color:var(--muted)}
.scorepill{display:inline-flex;align-items:baseline;gap:8px;font-family:var(--font-display);font-weight:700;font-size:1.6rem}
.scorepill small{font-family:var(--font-body);font-size:.85rem;font-weight:500;color:var(--muted)}
.rate{display:flex;flex-wrap:wrap;gap:6px}
.rate button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.checks{display:flex;flex-direction:column;gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start}
.checks input{width:auto;margin-top:5px}

/* ---------- grafikler ---------- */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;overflow-x:auto}
.chart h5{margin:0 0 8px;font:600 .95rem var(--font-body)}
.chart svg{display:block;max-width:100%;height:auto}
.chart text{font-family:var(--font-body);font-size:12px;fill:var(--muted)}
.chart text.v{fill:var(--ink);font-weight:600}
.chart .grid{stroke:var(--line);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.88rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.flow{display:flex;flex-wrap:wrap;gap:10px 26px;list-style:none;margin:0;padding:0;counter-reset:st}
.flow li{position:relative;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--sunk);font-weight:500;max-width:170px;counter-increment:st}
.flow li::before{content:counter(st) ". ";color:var(--muted);font-family:var(--font-mono)}
.flow li:not(:last-child)::after{content:"→";position:absolute;right:-20px;top:50%;transform:translateY(-50%);color:var(--muted)}

/* ---------- ilerleme ---------- */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,16px);gap:4px;justify-content:start}
.heat i{width:16px;height:16px;border-radius:4px;background:var(--sunk);display:block}
.heat i.l1{background:color-mix(in srgb,var(--ls) 35%,var(--sunk))}
.heat i.l2{background:color-mix(in srgb,var(--ls) 65%,var(--sunk))}
.heat i.l3{background:var(--ls)}
.heat i.fut{opacity:.35}
.heat i.now{outline:2px solid var(--ink);outline-offset:1px}
.skillrow{display:grid;grid-template-columns:90px minmax(0,1fr) 56px;gap:12px;align-items:center}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem}
.form .hint{font-weight:400;color:var(--muted);font-size:.84rem}
.checkrow{display:flex;flex-wrap:wrap;gap:8px 18px}
.checkrow label{flex-direction:row;align-items:center;font-weight:500}
.checkrow input{width:auto}
.hint{color:var(--muted);font-size:.86rem}
code.box{display:block;white-space:pre-wrap;word-break:break-all;background:var(--sunk);border-radius:8px;padding:10px;font:500 .78rem var(--font-mono);max-height:120px;overflow:auto}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Bölümler"><div class="rail-in">
    <div class="brand">PTE <span>Çalışma Masası</span></div>
    <div class="nav" id="nav"></div>
    <div class="rail-foot" id="railfoot"></div>
  </div></nav>
  <main id="main"></main>
</div>
<script>
/* ===================== PTE Academic içerik bankası (özgün örnek sorular) ===================== */
const SKILLS = {
  S: { name: 'Konuşma', en: 'Speaking', color: 'var(--sp)' },
  W: { name: 'Yazma', en: 'Writing', color: 'var(--wr)' },
  R: { name: 'Okuma', en: 'Reading', color: 'var(--rd)' },
  L: { name: 'Dinleme', en: 'Listening', color: 'var(--ls)' }
};

const TYPES = {
  RA: { name: 'Read Aloud', skill: 'S', kind: 'speak', est: 1.5, prep: 35, speak: 40, time: '30–40 sn hazırlık, 40 sn konuşma',
    what: 'Ekrandaki metni (en fazla 60 kelime) yüksek sesle okursunuz.',
    tips: ['Hazırlık süresinde metni içinizden bir kez okuyun; zor kelimeleri ve duracağınız yerleri belirleyin.', 'Sabit bir tempoda okuyun. Takıldığınız kelimede geri dönmeyin, devam edin.', 'Virgülde kısa durun, noktada sesinizi alçaltın.'] },
  RS: { name: 'Repeat Sentence', skill: 'S', kind: 'speak', est: 0.6, prep: 0, speak: 15, audio: true, time: '15 sn konuşma',
    what: '3–9 saniyelik bir cümleyi dinler ve aynen tekrar edersiniz.',
    tips: ['Cümleyi anlam gruplarına bölerek aklınızda tutun.', 'Tamamını hatırlamıyorsanız hatırladığınız kısmı akıcı söyleyin; doğru kelimeler kısmi puan getirir.', 'Ses biter bitmez başlayın. Sınavda 3 saniye sessiz kalırsanız kayıt kapanır.'] },
  DI: { name: 'Describe Image', skill: 'S', kind: 'speak', est: 1.5, prep: 25, speak: 40, time: '25 sn hazırlık, 40 sn konuşma',
    what: 'Bir grafik, tablo veya şemayı anlatırsınız.',
    tips: ['Sıra: konu, en yüksek ve en düşük değer, genel eğilim, tek cümlelik sonuç.', 'Bütün sayıları saymayın; 3–4 belirgin veriyi seçin.', 'Ezber kalıpları tekrar etmek puan düşürür. Görseldeki gerçek içeriği anlatın.'] },

  SWT: [
    { text: "For decades, managers assumed that employees needed to be watched in order to be productive. The rapid expansion of remote work has tested that assumption. Several large studies have found that people working from home complete at least as many tasks as their office-based colleagues, largely because they lose less time to commuting and interruptions. However, the same studies report costs that are harder to measure. Remote workers have fewer chance conversations, which are often the source of new ideas, and junior staff learn more slowly when they cannot observe experienced colleagues. Promotions, too, tend to go to those who are physically visible. For these reasons, many organisations are now adopting hybrid arrangements, in which employees spend part of the week at home and part in the office, hoping to combine the focus of the former with the collaboration of the latter.",
      kp: [ { label: 'Uzaktan çalışanlar en az ofistekiler kadar üretken', kw: ['productiv', 'as many tasks', 'efficient', 'as much'] }, { label: 'Bedeli: daha az iş birliği, öğrenme, görünürlük', kw: ['collaborat', 'ideas', 'learn', 'promotion', 'conversation', 'visib'] }, { label: 'Sonuç: hibrit düzen', kw: ['hybrid'] } ],
      model: "Although studies show that remote employees are at least as productive as office workers because they avoid commuting and interruptions, working from home reduces spontaneous collaboration, slows the learning of junior staff and can harm promotion prospects, so many organisations are adopting hybrid arrangements that combine focused work at home with collaboration in the office." },
    { text: "Antibiotics are among the most important medical discoveries of the twentieth century, but their effectiveness is under threat. Bacteria reproduce quickly, and each time an antibiotic is used, the few organisms that happen to survive pass on their resistance. Overuse accelerates this process. In many countries antibiotics are prescribed for viral infections, against which they are useless, and large quantities are given to healthy farm animals to promote growth. Meanwhile, pharmaceutical companies have little financial incentive to develop new antibiotics, since such drugs are taken for only a few days and must be used sparingly. Health agencies warn that, without action, routine operations could once again become dangerous. Proposed responses include stricter rules on prescribing, a ban on agricultural misuse, and public funding to reward the development of new drugs.",

      model: "Antibiotics are losing their effectiveness because bacteria develop resistance, a process accelerated by overuse in medicine and agriculture, while companies have little incentive to develop new drugs, so health agencies recommend stricter prescribing rules, a ban on agricultural misuse and public funding for new antibiotics." },
    { text: "Traditionally, academic journals have covered their costs by charging readers, usually through expensive subscriptions paid by university libraries. Critics argue that this model is unfair, since much research is funded by taxpayers who then cannot read the results. Open access publishing offers an alternative: articles are free to read online, and the cost is met by a fee paid by the author or the author's funder. The approach has clear advantages. Open access articles reach a wider audience, including researchers in poorer countries, and tend to be cited more often. Yet it has created problems of its own. Publication fees can amount to several thousand dollars, which disadvantages researchers without generous grants, and the model has encouraged so-called predatory journals that accept almost any paper in return for payment. Most observers nevertheless expect open access to become the norm.",

      model: "Open access publishing, which makes research free to read by charging authors rather than readers, widens the audience for publicly funded research and increases citations, but its high publication fees disadvantage poorly funded researchers and have encouraged predatory journals, although it is still expected to become the norm." }

function startSession(title, pairs, opts) {

    const bank = BANK[t], ptr = (S.types[t] && S.types[t].ptr) || 0, k = Math.min(n, bank.length);
    for (let i = 0; i < k; i++) queue.push({ t, i: (ptr + i) % bank.length });

}
function record(t, i, score, sec) {

  day.q++; day.sec += Math.max(5, Math.min(sec, 1800));
  const ty = S.types[t] || (S.types[t] = { n: 0, sum: 0, ptr: 0 });

KIND.bank = (t, q, stage, ctx) => {
  const filled = q.ans.map(() => null), all = q.ans.concat(q.extra).sort();
  const p = h('div'), bank = h('div', { class: 'bank' });

    p.replaceChildren(fillText(q, n => h('button', { type: 'button', class: 'slot' + (filled[n] ? ' filled' : ''), 'aria-label': 'Boşluk ' + (n + 1) + (filled[n] ? ': ' + filled[n] : ''), onclick: () => { if (locked || !filled[n]) return; filled[n] = null; draw(); } }, filled[n] || ' ')));
    bank.replaceChildren(...all.filter(w => !filled.includes(w)).map(w => h('button', { type: 'button', class: 'word', onclick: () => { const k = filled.indexOf(null); if (locked || k < 0) return; filled[k] = w; draw(); } }, w)));
    if (!bank.children.length) bank.append(h('span', { class: 'hint' }, 'Bütün kelimeler yerleştirildi.'));
  };

  submit.addEventListener('click', () => {

KIND.reorder = (t, q, stage, ctx) => {
  const n = q.items.length;
  let order = n === 4 ? [2, 0, 3, 1] : n === 5 ? [3, 0, 4, 2, 1] : q.items.map((x, i) => n - 1 - i);
  const list = h('ol', { class: 'order' });

  const draw = () => list.replaceChildren(...order.map((idx, k) => h('li', null,
    h('div', { class: 'mv' },
      h('button', { class: 'btn sm', type: 'button', 'aria-label': 'Yukarı taşı', disabled: k === 0 || locked, onclick: () => { [order[k - 1], order[k]] = [order[k], order[k - 1]]; draw(); } }, '↑'),
      h('button', { class: 'btn sm', type: 'button', 'aria-label': 'Aşağı taşı', disabled: k === n - 1 || locked, onclick: () => { [order[k + 1], order[k]] = [order[k], order[k + 1]]; draw(); } }, '↓')),
    h('span', null, q.items[idx]))));
  draw();
  const submit = h('button', { class: 'btn primary', type: 'button' }, 'Kontrol et');
  stage.append(list, h('div', { class: 'row' }, submit));
  submit.addEventListener('click', () => {
    locked = true; draw();
    let pairs = 0; for (let k = 0; k < n - 1; k++) if (order[k + 1] === order[k] + 1) pairs++;
    [...list.children].forEach((li, k) => li.classList.add(order[k] === k ? 'ok' : 'no'));
    ctx.review({ score: pairs / (n - 1), label: 'doğru komşu çiftler', body: [sec('Doğru sıra', h('ol', null, q.items.map(s => h('li', null, s))))] });
  });
};
KIND.hiw = (t, q, stage, ctx) => {
  const shown = q.shown.split(' '), heard = q.audio.split(' ');
  const wrong = new Set(); shown.forEach((w, i) => { if (norm(w).join() !== norm(heard[i] || '').join()) wrong.add(i); });
  const sel = new Set(); let locked = false;
  const p = h('p', { class: 'passage hiw' });
  const spans = shown.map((w, i) => { const s = h('span', { role: 'button', tabindex: '0', 'aria-pressed': 'false' }, w); const tog = () => { if (locked) return; if (sel.has(i)) sel.delete(i); else sel.add(i); s.classList.toggle('sel', sel.has(i)); s.setAttribute('aria-pressed', sel.has(i) ? 'true' : 'false'); }; s.addEventListener('click', tog); s.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tog(); } }); return s; });
  spans.forEach((s, i) => { p.append(s); if (i < spans.length - 1) p.append(' '); });
  const submit = h('button', { class: 'btn primary', type: 'button' }, 'Kontrol et');
  stage.append(audioWidget([{ text: q.audio }], { fallback: box => { box.querySelector('.hint').textContent = 'Bu görünümde ses çalınamadı. Bağlama uymayan kelimeleri işaretleyerek çalışın.'; } }), h('p', { class: 'hint' }, 'Kayıtta söylenenden farklı olan kelimelere dokunun.'), p, h('div', { class: 'row' }, submit));
  submit.addEventListener('click', () => {
    locked = true; p.classList.add('done');
    let hits = 0, falses = 0;
    spans.forEach((s, i) => { s.classList.remove('sel'); if (wrong.has(i) && sel.has(i)) { hits++; s.classList.add('hit'); } else if (wrong.has(i)) s.classList.add('miss'); else if (sel.has(i)) { falses++; s.classList.add('false'); } });
    const pairs = [...wrong].map(i => h('li', null, `${shown[i].replace(/[.,]/g, '')} → ${heard[i].replace(/[.,]/g, '')}`));
    ctx.review({ score: Math.max(0, hits - falses) / wrong.size, body: [sec('Sonuç', h('p', null, `${hits} doğru, ${falses} yanlış işaretleme; toplam ${wrong.size} farklı kelime vardı.`)), sec('Ekranda yazan → kayıtta söylenen', h('ul', null, pairs)), transcriptDetails(q.audio)] });
  });
};
KIND.wfd = (t, q, stage, ctx) => {
  const input = h('input', { type: 'text', id: 'wfd-answer', 'aria-label': 'Duyduğunuz cümle', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: 'Duyduğunuz cümleyi yazın' });
  const submit = h('button', { class: 'btn primary', type: 'button' }, 'Kontrol et');
  stage.append(audioWidget([{ text: q.text }], { fallback: flash(q.text) }), input, h('div', { class: 'row' }, submit));
  const go = () => {
    const ref = norm(q.text), hyp = norm(input.value), bag = {}; hyp.forEach(w => bag[w] = (bag[w] || 0) + 1);
    const missing = ref.filter(w => { if (bag[w] > 0) { bag[w]--; return false; } return true; });
    ctx.review({ score: bagMatch(ref, hyp), label: 'doğru kelimeler', body: [sec('Cümle', h('p', null, q.text)), sec('Sizin yazdığınız', h('p', null, input.value.trim() || '(boş)')), missing.length ? sec('Eksik ya da hatalı kelimeler', h('p', { class: 'pct bad' }, missing.join(', '))) : null] });
  };
  submit.addEventListener('click', go);
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !submit.disabled) go(); });
};

/* ---------- Describe Image grafikleri ---------- */
function svg(w, hgt, inner) { return `<svg viewBox="0 0 ${w} ${hgt}" width="${w}" role="img" aria-label="Grafik">${inner}</svg>`; }
const niceStep = m => { const p = Math.pow(10, Math.floor(Math.log10(m))); return [0.1, 0.2, 0.25, 0.5, 1, 2].map(k => k * p).find(st => m / st <= 5); };
function drawChart(c) {
  const box = h('div', { class: 'chart' }, h('h5', null, c.title));
  const W = 560, H = 300, L = 52, R = 16, T = 16, B = 40;
  if (c.type === 'flow') { box.append(h('ol', { class: 'flow' }, c.data.map(s => h('li', null, s)))); return box; }
  if (c.type === 'pie') {
    const cols = ['var(--rd)', 'var(--sp)', 'var(--ls)', 'var(--wr)', 'var(--muted)'], tot = c.data.reduce((a, d) => a + d[1], 0);
    let a0 = -Math.PI / 2, out = '';
    c.data.forEach((d, i) => {
      const a1 = a0 + d[1] / tot * Math.PI * 2, r = 110, cx = 130, cy = 130, big = a1 - a0 > Math.PI ? 1 : 0;
      out += `<path d="M${cx},${cy} L${cx + r * Math.cos(a0)},${cy + r * Math.sin(a0)} A${r},${r} 0 ${big} 1 ${cx + r * Math.cos(a1)},${cy + r * Math.sin(a1)} Z" style="fill:${cols[i % 5]};stroke:var(--surface);stroke-width:2"/>`;
      a0 = a1;
    });
    box.append(h('div', { html: svg(260, 260, out) }), h('div', { class: 'legend' }, c.data.map((d, i) => h('span', null, h('i', { style: `background:${cols[i % 5]}` }), `${d[0]}: ${d[1]}%`))));
    return box;
  }
  const top = Math.max(...c.data.map(d => d[1])), step = niceStep(top), max = Math.ceil(top / step) * step, pw = W - L - R, ph = H - T - B, y = v => T + ph - v / max * ph;
  let out = '';
  for (let v = 0; v <= max + 1e-9; v += step) { out += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${Math.round(v).toLocaleString('en-US')}</text>`; }
  if (c.type === 'bar') {
    const bw = pw / c.data.length;
    c.data.forEach((d, i) => { const x = L + i * bw + bw * 0.2, w = bw * 0.6; out += `<rect x="${x}" y="${y(d[1])}" width="${w}" height="${T + ph - y(d[1])}" rx="3" style="fill:var(--rd)"/><text class="v" x="${x + w / 2}" y="${y(d[1]) - 6}" text-anchor="middle">${d[1]}</text><text x="${x + w / 2}" y="${H - 14}" text-anchor="middle">${esc(d[0])}</text>`; });
  } else {
    const step = pw / (c.data.length - 1), pts = c.data.map((d, i) => [L + i * step, y(d[1])]);
    out += `<path d="M${pts[0][0]},${T + ph} ${pts.map(p => `L${p[0]},${p[1]}`).join(' ')} L${pts[pts.length - 1][0]},${T + ph} Z" style="fill:var(--rd);opacity:.12"/><polyline points="${pts.map(p => p.join(',')).join(' ')}" style="fill:none;stroke:var(--rd);stroke-width:2.5"/>`;
    c.data.forEach((d, i) => { const last = i === pts.length - 1; out += `<circle cx="${pts[i][0]}" cy="${pts[i][1]}" r="${last ? 5 : 3}" style="fill:var(--rd)"/><text x="${pts[i][0]}" y="${H - 14}" text-anchor="middle">${esc(d[0])}</text>`; if (last || i === 0 || d[1] === Math.min(...c.data.map(z => z[1]))) out += `<text class="v" x="${pts[i][0]}" y="${pts[i][1] - 10}" text-anchor="${last ? 'end' : i === 0 ? 'start' : 'middle'}">${d[1].toLocaleString('en-US')}</text>`; });
  }
  box.append(h('div', { html: svg(W, H, out) }), h('p', { class: 'hint' }, 'Birim: ' + c.unit));
  return box;
}

function viewMock() {
  const cards = Object.keys(MOCKS).map(k => { const m = MOCKS[k], n = m.items.reduce((a, x) => a + x[1], 0); return `<div class="card type" style="--c:var(--mark)"><h3>${m.name}</h3><p class="small">${n} soru, yaklaşık ${m.min} dakika. Konuşma, yazma, okuma ve dinleme görevleri sınavdaki sırayla gelir.</p><div class="foot"><span class="small muted">Ara vermeden çözün</span><button class="btn primary sm" data-act="mock" data-kind="${k}">Denemeyi başlat</button></div></div>`; }).join('');
  const hist = S.mocks.slice().reverse().map(m => `<tr><td>${fmtDate(m.date, { day: 'numeric', month: 'long' })}</td><td>${MOCKS[m.kind] ? MOCKS[m.kind].name : m.kind}</td><td class="r"><span class="pct ${grade(m.score)}">${pctText(m.score)}</span></td>${['S', 'W', 'R', 'L'].map(k => `<td class="r">${m.bySkill && m.bySkill[k] != null ? pctText(m.bySkill[k]) : '–'}</td>`).join('')}</tr>`).join('');
  return `<div class="view"><div class="head"><div><h1>Deneme</h1><p class="sub">Kısaltılmış sınav provaları. Gerçek sınav yaklaşık 2 saat sürer; bu denemeler tempo ve geçiş alışkanlığı kazandırır, resmi puan tahmini vermez.</p></div></div>
    <div class="types">${cards}</div>
    <h2>Geçmiş denemeler</h2>
    <div class="card tablewrap">${hist ? `<table><thead><tr><th>Tarih</th><th>Deneme</th><th class="r">Genel</th><th class="r">Konuşma</th><th class="r">Yazma</th><th class="r">Okuma</th><th class="r">Dinleme</th></tr></thead><tbody>${hist}</tbody></table>` : '<p class="muted">Henüz deneme çözmediniz. Plan her cumartesi bir deneme önerir.</p>'}</div>
    <div class="note">Tam uzunlukta ve puanlı bir prova için Pearson’ın resmi puanlı deneme sınavını sınavdan 1–2 hafta önce çözmenizi öneririm.</div></div>`;
}

function viewProgress() {
  const st = streakInfo(), t = today(), s = S.settings;
  const keys = Object.keys(S.days).filter(active), totalSec = keys.reduce((a, k) => a + (S.days[k].sec || 0), 0), totalQ = keys.reduce((a, k) => a + (S.days[k].q || 0), 0);
  const mon = addDays(t, -((parse(t).getDay() + 6) % 7)), first = addDays(mon, -77);
  let heat = '';
  for (let i = 0; i < 84; i++) { const d = addDays(first, i), x = S.days[d], m = x ? x.sec / 60 : 0, lvl = !active(d) ? '' : m >= s.minutes ? 'l3' : m >= s.minutes / 2 ? 'l2' : 'l1'; heat += `<i class="${lvl} ${d > t ? 'fut' : ''} ${d === t ? 'now' : ''}" title="${fmtDate(d)}: ${Math.round(m)} dk"></i>`; }
  const skills = Object.keys(SKILLS).map(k => { const a = skillAvg(k); return `<div class="skillrow"><span>${SKILLS[k].name}</span><div class="bar"><i style="width:${a == null ? 0 : a * 100}%;--c:${SKILLS[k].color}"></i></div><span class="num pct ${grade(a)}" style="text-align:right">${a == null ? '–' : pctText(a)}</span></div>`; }).join('');
  const rows = TYPE_ORDER.map(x => { const a = typeAvg(x), ty = S.types[x]; return `<tr><td><span class="chip"><i class="dot" style="--c:${SKILLS[TYPES[x].skill].color}"></i>${SKILLS[TYPES[x].skill].name}</span></td><td>${esc(TYPES[x].name)}</td><td class="r">${ty ? ty.n : 0}</td><td class="r"><span class="pct ${grade(a)}">${a == null ? '–' : pctText(a)}</span></td><td class="r">${ty && ty.last ? fmtDate(ty.last) : '–'}</td></tr>`; }).join('');
  const weak = weakestTypes(3).filter(x => typeAvg(x) != null);
  return `<div class="view"><div class="head"><div><h1>İlerleme</h1><p class="sub">Hedef puan ${s.target} için bu platformun çalışma eşiği ${pctText(goalPct())}. Bu eşik bir çalışma ölçüsüdür, resmi puan dönüşümü değildir.</p></div></div>
    <div class="grid tiles">
      <div class="card tile"><div class="big">${st.cur}</div><div class="lab">gün seri</div></div>
      <div class="card tile"><div class="big">${st.best}</div><div class="lab">en uzun seri</div></div>
      <div class="card tile"><div class="big">${keys.length}</div><div class="lab">çalışılan gün</div></div>
      <div class="card tile"><div class="big">${totalSec >= 3600 ? (totalSec / 3600).toFixed(1).replace('.', ',') + ' sa' : Math.round(totalSec / 60) + ' dk'}</div><div class="lab">toplam süre</div></div>
      <div class="card tile"><div class="big">${totalQ}</div><div class="lab">çözülen soru</div></div>
    </div>
    <div class="card"><div class="spread"><h3>Son 12 hafta</h3><span class="small muted">Koyu kare: günlük hedef tamamlandı</span></div><div class="tablewrap" style="margin-top:12px"><div class="heat">${heat}</div></div></div>
    <div class="card"><h3>Becerilere göre ortalama</h3><div class="grid" style="margin-top:12px">${skills}</div></div>
    ${weak.length ? `<div class="note"><strong>Öncelik listeniz.</strong> Ortalaması en düşük görev tipleri: ${weak.map(x => esc(TYPES[x].name) + ' (' + pctText(typeAvg(x)) + ')').join(', ')}. Pazar günkü tekrar bloğu bunları kendiliğinden seçer.</div>` : ''}
    <h2>Görev tiplerine göre</h2>
    <div class="card tablewrap"><table><thead><tr><th>Beceri</th><th>Görev tipi</th><th class="r">Soru</th><th class="r">Ortalama</th><th class="r">Son çalışma</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>`;
}

function viewSettings() {
  const s = S.settings;
  return `<div class="view"><div class="head"><div><h1>Ayarlar</h1><p class="sub">Plan bu bilgilere göre kurulur. Kaydedince bugünün görevleri yeniden hesaplanır.</p></div></div>
    ${store.ok ? '' : '<div class="note">Tarayıcınız bu sayfanın veri saklamasına izin vermiyor. İlerlemeniz yalnızca sayfa açık kaldığı sürece tutulur; aşağıdaki yedeği kopyalayarak saklayabilirsiniz.</div>'}
    <div class="card"><div class="form">
      <label for="set-exam">Sınav tarihi<input type="date" id="set-exam" value="${s.exam}" min="${today()}"><span class="hint">Henüz belli değilse tahmini bir tarih girin.</span></label>
      <label for="set-target">Hedef puan (10–90)<input type="number" id="set-target" min="10" max="90" value="${s.target}"><span class="hint">Başvurduğunuz doktora programının istediği genel puan.</span></label>
      <label for="set-minutes">Günlük çalışma süresi<select id="set-minutes">${[30, 45, 60, 90, 120].map(m => `<option value="${m}" ${m === s.minutes ? 'selected' : ''}>${m} dakika</option>`).join('')}</select><span class="hint">Her gün gerçekten ayırabileceğiniz süre.</span></label>
      <label for="set-start">Plan başlangıcı<input type="date" id="set-start" value="${s.start}" max="${today()}"><span class="hint">Haftalar bu tarihten sayılır.</span></label>
    </div>
    <div style="margin-top:18px"><div class="form"><div><label>Öncelik vermek istediğiniz beceriler</label><div class="checkrow" style="margin-top:8px">${Object.keys(SKILLS).map(k => `<label for="weak-${k}"><input type="checkbox" id="weak-${k}" value="${k}" ${s.weak.includes(k) ? 'checked' : ''}> ${SKILLS[k].name}</label>`).join('')}</div><p class="hint" style="margin-top:6px">Seçtikleriniz için hafta içi her gün yaklaşık 10 dakikalık ek blok eklenir.</p></div></div></div>
    <div class="row" style="margin-top:18px"><button class="btn primary" data-act="save-settings">Kaydet</button><span class="small pct good" id="saved" role="status"></span></div></div>
    <h2>Yedek</h2>
    <div class="card"><p class="small muted">İlerlemeniz yalnızca bu tarayıcıda durur. Başka bir cihaza taşımak ya da saklamak için yedeği kopyalayın.</p>
      <div class="row" style="margin-top:12px"><button class="btn sm" data-act="copy-backup">Yedeği kopyala</button><span class="small" id="copied" role="status"></span></div>
      <label for="restore" class="small" style="display:block;margin-top:16px;font-weight:600">Yedekten geri yükle</label>
      <textarea id="restore" style="min-height:80px;margin-top:6px" placeholder="Kopyaladığınız yedeği buraya yapıştırın"></textarea>
      <div class="row" style="margin-top:10px"><button class="btn sm" data-act="restore">Geri yükle</button><span class="small" id="restored" role="status"></span></div></div>
    <h2>Sıfırla</h2>
    <div class="card"><p class="small muted">Bütün ilerleme, seri ve ayarlar silinir. Bu işlem geri alınamaz.</p><div class="row" style="margin-top:12px" id="resetrow"><button class="btn sm danger" data-act="reset-ask">Tüm ilerlemeyi sil</button></div></div>
  </div>`;
}

function viewSummary() {
  const r = session.results, avg = r.length ? r.reduce((a, x) => a + x.score, 0) / r.length : 0, st = streakInfo();
  const rows = r.map((x, i) => `<tr><td class="num">${i + 1}</td><td>${esc(TYPES[x.t].name)}</td><td class="r"><span class="pct ${grade(x.score)}">${pctText(x.score)}</span></td></tr>`).join('');
  return `<div class="view"><div class="head"><div><h1>Oturum tamamlandı</h1><p class="sub">${esc(session.title)} · ${r.length} soru</p></div></div>
    <div class="grid tiles"><div class="card tile"><div class="big pct ${grade(avg)}">${pctText(avg)}</div><div class="lab">oturum ortalaması</div></div><div class="card tile"><div class="big">${st.cur}</div><div class="lab">gün seri</div></div></div>
    <div class="card tablewrap"><table><thead><tr><th>#</th><th>Görev tipi</th><th class="r">Puan</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="row"><button class="btn primary" data-act="close-session">Bugüne dön</button><button class="btn" data-act="close-session" data-to="ilerleme">İlerlemeyi gör</button></div></div>`;
}

function render() {
  const r = route();
  $('#nav').innerHTML = NAV.map(([k, n]) => `<a href="#${k}" ${k === r && !session ? 'aria-current="page"' : ''}>${n}</a>`).join('');
  $('#railfoot').textContent = store.ok ? 'İlerlemeniz bu tarayıcıda saklanır.' : 'Tarayıcı depolaması kapalı; ilerleme bu oturumla sınırlı.';
  if (session) { if (session.done) main.innerHTML = viewSummary(); else showQuestion(); return; }
  main.innerHTML = ({ bugun: viewToday, plan: viewPlan, pratik: viewPractice, deneme: viewMock, ilerleme: viewProgress, ayarlar: viewSettings })[r]();
}

main.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, t = today();
  if (act === 'block') {
    const blk = dayPlan(t).blocks.find(x => x.id === b.dataset.id); if (!blk) return;
    if (blk.kind === 'mock') startSession(MOCKS[blk.variant].name, MOCKS[blk.variant].items, { blockId: blk.id, mock: blk.variant });
    else startSession(blk.title, blk.items, { blockId: blk.id });
  } else if (act === 'manual') {
    const day = S.days[t] || (S.days[t] = { sec: 0, q: 0, tasks: {} });
    if (day.tasks[b.dataset.id]) delete day.tasks[b.dataset.id]; else day.tasks[b.dataset.id] = true;
    save(); render();
  } else if (act === 'practice') startSession('Serbest pratik', [[b.dataset.type, Number(b.dataset.n)]]);
  else if (act === 'mock') startSession(MOCKS[b.dataset.kind].name, MOCKS[b.dataset.kind].items, { mock: b.dataset.kind });
  else if (act === 'close-session') { session = null; const to = b.dataset.to || 'bugun'; if (route() === to) render(); else location.hash = to; }
  else if (act === 'save-settings') {
    const s = S.settings, exam = $('#set-exam').value, start = $('#set-start').value, target = Number($('#set-target').value);
    if (exam) s.exam = exam;
    if (start && start <= t) s.start = start;
    if (target >= 10 && target <= 90) s.target = Math.round(target);
    s.minutes = Number($('#set-minutes').value) || 60;
    s.weak = Object.keys(SKILLS).filter(k => $('#weak-' + k).checked);
    s.setup = true; save(); render();
    $('#saved').textContent = `Kaydedildi. Plan ${weeksTotal()} hafta olarak kuruldu.`;
  } else if (act === 'copy-backup') {
    const txt = JSON.stringify(S), out = $('#copied');
    const fallback = () => { const ta = $('#restore'); ta.value = txt; ta.select(); out.textContent = 'Otomatik kopyalanamadı. Yedek aşağıdaki kutuya yazıldı; seçip kopyalayın.'; };
    try { navigator.clipboard.writeText(txt).then(() => { out.textContent = 'Yedek panoya kopyalandı.'; }, fallback); } catch (err) { fallback(); }
  } else if (act === 'restore') {
    const out = $('#restored');
    try { const v = JSON.parse($('#restore').value); if (!v || !v.settings || !v.days) throw 0; S = hydrate(v); save(); render(); $('#restored').textContent = 'Yedek geri yüklendi.'; }
    catch (err) { out.textContent = 'Bu metin geçerli bir yedek değil. Yedeğin tamamını yapıştırdığınızdan emin olun.'; }
  } else if (act === 'reset-ask') {
    $('#resetrow').innerHTML = '<span class="small">Emin misiniz?</span><button class="btn sm danger" data-act="reset-yes">Evet, hepsini sil</button><button class="btn sm" data-act="reset-no">Vazgeç</button>';
  } else if (act === 'reset-no') render();
  else if (act === 'reset-yes') { S = fresh(); save(); location.hash = 'bugun'; render(); }
});
$('#nav').addEventListener('click', e => { if (session && e.target.closest('a')) { clearQ(); session = null; render(); window.scrollTo(0, 0); } });
window.addEventListener('hashchange', () => { if (session) { clearQ(); session = null; } render(); window.scrollTo(0, 0); });

AudioOut.init(); Dict.init();
render();
})();
</script>
</body>
</html>
